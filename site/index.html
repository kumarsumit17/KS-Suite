<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>KS-Suite: free, private apps</title>
  <meta name="description" content="Free, privacy-focused apps for the TV, the desktop and the phone. No ads, no tracking.">
  <link rel="icon" href="icons/ks-suite.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#apps" data-t="nav.skip">Skip to apps</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./"><img src="icons/ks-suite.svg" alt="">KS-Suite</a>
      <div class="controls">
        <div class="switch theme-switch" role="group" aria-label="Theme" data-t-label="theme.label">
          <button type="button" data-theme-choice="system" aria-pressed="true" aria-label="System" data-t-label="theme.system" data-icon="monitor"></button>
          <button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light" data-t-label="theme.light" data-icon="sun"></button>
          <button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark" data-t-label="theme.dark" data-icon="moon"></button>
        </div>
        <div class="lang-select">
          <label for="lang-select" class="visually-hidden" data-t="nav.language">Language</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <select id="lang-select">
            <option value="system" data-t="lang.system">System</option>
            <option value="en" lang="en">English</option>
            <option value="hi" lang="hi">हिंदी</option>
          </select>
          <svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow" data-t="hero.eyebrow">Free and open source</p>
        <h1 data-t="hero.title">Free, private apps for the TV, the desktop and the phone.</h1>
        <p class="hero-actions">
          <a class="btn btn-large" href="#apps" data-t="hero.cta">See the apps</a>
        </p>
        <ul class="points" id="points"></ul>
      </div>
    </section>

    <section class="apps wrap" id="apps" tabindex="-1" aria-labelledby="apps-heading">
      <div class="section-head">
        <h2 id="apps-heading" data-t="apps.heading">Apps</h2>
        <p class="muted" data-t="apps.intro">Each card shows the newest release. Downloads come straight from GitHub.</p>
      </div>
      <ul class="grid" id="grid"></ul>
      <noscript>
        <p>This page needs JavaScript to list the apps. The same list, with links to each app's releases, is in the <a href="https://github.com/kumarsumit17/KS-Suite#readme">README</a>.</p>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        <a href="https://github.com/kumarsumit17/KS-Suite/blob/main/LICENSE" data-t="footer.licence">MIT licence</a>
        <a href="https://github.com/kumarsumit17/KS-Suite" data-t="link.source">Source on GitHub</a>
        <span class="muted" data-t="footer.privacy">This page has no analytics and sets no cookies.</span>
      </p>
    </div>
  </footer>
</body>
</html>
